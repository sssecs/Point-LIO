/**:
    ros__parameters:
        # Mapping-mode config: builds the map online from the raw scans.
        # Same sensor chain as mid360.yaml (Mid-360 PCL, upside-down mounting).
        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_diff_lidar_to_imu: 0.0
            frame_merge_num: 1           # set to 10 when using a 100 Hz lidar

        frame:
            map_frame: "map"
            base_frame: "base_link"
            lidar_frame: "livox_frame"

        preprocess:
            blind: 0.5

        filter_size_surf: 0.3
        filter_size_map: 0.3
        ivox_nearby_type: 18
        space_down_sample: true

        prop_at_freq_of_imu: true
        use_imu_as_input: false
        check_satu: true
        init_map_size: 100

        mapping:
            imu_en: true
            extrinsic_est_en: false
            imu_time_inte: 0.005
            lidar_time_inte: 0.1
            satu_acc: 3.0
            satu_gyro: 35.0
            acc_norm: 1.0
            lidar_meas_cov: 0.01
            acc_cov_output: 500.0
            gyr_cov_output: 1000.0
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            imu_meas_acc_cov: 0.1
            imu_meas_omg_cov: 0.1
            gyr_cov_input: 0.01
            acc_cov_input: 0.1
            vel_cov: 20.0
            plane_thr: 0.1
            match_s: 81.0
            ivox_grid_resolution: 0.2
            gravity: [0.0, 0.0, -9.81]
            gravity_init: [0.0, 0.0, -9.81]
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1. ]

        odometry:
            publish_odometry_without_downsample: false

        publish:
            path_en: true
            scan_publish_en: true
            scan_bodyframe_pub_en: false

        pcd_save:
            pcd_save_en: true
            interval: 1000000       # accumulate all scans; saved once at shutdown

        runtime_pos_log_enable: true

        localization:
            enable_localization: false
            enable_map_incremental: true
